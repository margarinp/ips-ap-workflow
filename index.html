<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPS AP Workflow</title>
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<style>
:root{
  --paper:#F4F6F7;--surface:#fff;--surface-2:#EBEFF1;--line:#D3DBDF;--line-soft:#E6EBEE;
  --ink:#16202B;--ink-2:#43535F;--ink-3:#71828E;
  --accent:#14607F;--accent-ink:#0C4257;--accent-wash:#E2EEF3;
  --amber:#9A6510;--amber-wash:#F6EDDC;--green:#256B4C;--green-wash:#E0EFE7;
  --violet:#5E4B8B;--violet-wash:#ECE7F5;--red:#A63328;--red-wash:#F6E4E1;
  --shadow:0 1px 2px rgba(22,32,43,.06),0 8px 24px -12px rgba(22,32,43,.25);--r:6px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
button{font:inherit;font-weight:600;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:7px 13px}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-ink)}
.btn-go{background:var(--green);border-color:var(--green);color:#fff}
.btn-go:hover{filter:brightness(.92);background:var(--green)}
.btn-warn{color:var(--amber);border-color:var(--amber)}
.btn-warn:hover{background:var(--amber-wash)}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{margin-right:auto;display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:18px}
.brand span{font-size:12px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.who{font-size:13px;color:var(--ink-2)}
.banner{padding:9px 20px;background:var(--amber-wash);color:var(--amber);font-size:13px;font-weight:600}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 56px)}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.rail{padding:18px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:6px 10px 8px}
.tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:var(--r);padding:9px 10px;color:var(--ink-2)}
.tab:hover{background:var(--surface-2)}
.tab[aria-current=true]{background:var(--accent-wash);color:var(--accent-ink)}
.tab small{display:block;font-weight:400;font-size:12px;color:var(--ink-3)}
.tabgroup{display:flex;align-items:center;gap:10px;padding:9px 10px 4px;font-weight:600;color:var(--ink-2)}
.tab.sub{padding-left:28px}
.tab .count{margin-left:auto;font:500 12px ui-monospace,Consolas,monospace;color:var(--ink-3)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.rail-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:10px}
main{padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.mainhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mainhead h2{margin:0;font-size:21px}
.mainhead p{margin:0;color:var(--ink-3);font-size:13px;width:100%}
.mainhead .right{margin-left:auto;display:flex;gap:8px;align-items:center}
input[type=search],textarea{font:inherit;border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;background:var(--surface);color:var(--ink)}
textarea{width:100%;resize:vertical;min-height:62px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface);padding:16px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;cursor:pointer}
.drop.hot{border-color:var(--accent);background:var(--accent-wash)}
.drop p{margin:0}.drop .hint{font-size:12px;color:var(--ink-3)}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th{text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.fname{font-weight:600;word-break:break-word}
.sub{font-size:12px;color:var(--ink-3)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.po{background:var(--violet-wash);color:var(--violet)}
.pill.de{background:var(--accent-wash);color:var(--accent-ink)}
.pill.q{background:var(--amber-wash);color:var(--amber)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.empty h3{margin:0 0 6px;color:var(--ink-2);font-size:16px}
.scrim{position:fixed;inset:0;background:rgba(16,23,32,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(700px,100%);z-index:41;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer header h3{margin:0 0 4px;font-size:17px;word-break:break-word}
.drawer .body{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.doc{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
.doc iframe{display:block;width:100%;height:60vh;min-height:360px;border:0;background:#fff}
.doc img{display:block;width:100%;max-height:60vh;object-fit:contain;background:#fff}
.trail{list-style:none;margin:0;padding:0}
.trail li{padding:0 0 12px 18px;position:relative;font-size:14px}
.trail li::before{content:"";position:absolute;left:3px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.trail .when{font-size:12px;color:var(--ink-3)}
.trail .note{font-style:italic;color:var(--ink-2)}
.actions{border-top:1px solid var(--line);padding:14px 20px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.actionrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hintline{font-size:13px;color:var(--ink-2)}
.signin{max-width:460px;margin:12vh auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;box-shadow:var(--shadow);text-align:center}
.signin h2{margin:0 0 6px}.signin p{color:var(--ink-2);margin:0 0 20px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;box-shadow:var(--shadow)}
</style>
</head>
<body>
<div id="app"><div class="empty" style="padding:80px">Loading…</div></div>
<div id="overlay"></div>
<input type="file" id="file" multiple accept="application/pdf,image/*" hidden>

<script>
/* =====================================================================
   SETTINGS — paste your two IDs from Entra (App registrations > Overview)
   Leave them blank to try the site in demo mode with sample invoices.
   ===================================================================== */
const CONFIG = {
  clientId: "e5b74cd2-f1a8-4d62-ae74-e174850e3596",   // "Application (client) ID"
  tenantId: "ba1ad26e-7a87-42b7-84b4-7e10215261f2",   // "Directory (tenant) ID"
  title: "IPS AP Workflow",

  // SharePoint: ConceptPaints › Shared Documents › AP JACK › IPS › AP › Workflow
  driveId: "b!7gYCR5N6nkWyW1FVltJE212Ea3Vs37tKg8DomOGMINY1zPhd50_NT4tSBCkC57GS",
  logFileId: "01MB735ZPBJ44S6SBKVJHY2FQAX3AYHVG2",          // _workflow-log.json
  stages: {
    drop:    {id:"", label:"Drop invoices here", who:"New invoices — pick a workflow", folder:"", color:"#16202B"},
    inbox:   {id:"01MB735ZOBWOGG37S3TVGZQ4DASXHGBKHW", label:"Unsorted (old 00 folder)", who:"Older files — send each to a workflow",       folder:"00 Invoice to process",          color:"#14607F"},
    receive: {id:"01MB735ZP2QWHC6EJEKNGIBTXUCHSVA2JB", label:"Receive invoice",     who:"Receive the goods / PO in Pronto",          folder:"01 Invoices - waiting receival", color:"#5E4B8B"},
    enter:   {id:"01MB735ZOT2NV5O4BAKNDZ2VUWKEKEBVOE", label:"Enter invoice",       who:"Enter in Pronto",                 folder:"03 To enter",                    color:"#256B4C"},
    queries: {id:"01MB735ZLGR6UUO6EA5VGIHEJIRJERUJFF", label:"Queries",             who:"Sent back — needs fixing",        folder:"04 Queries - sent back",         color:"#9A6510"},
    done:    {id:"01MB735ZN3LD42NUSDWZBJWGBKHDZUKYMX", label:"Completed",           who:"Entered and finished",            folder:"02 Invoices - completed",        color:"#71828E"}
  }
};
/* ===================================================================== */

(function(){
"use strict";
const GRAPH = "https://graph.microsoft.com/v1.0";
const SCOPES = ["User.Read","Files.ReadWrite.All"];
const ORDER = ["inbox","receive","enter","queries","done"];
const RAIL_LABEL = {receive:"Receive", enter:"Invoice Entry"};
const shown = () => ["drop"].concat(ORDER.filter(k => k !== "inbox" || items.inbox.length));
const DEMO = !CONFIG.clientId || !CONFIG.tenantId;
const app = document.getElementById("app"), overlay = document.getElementById("overlay"), fileInput = document.getElementById("file");

let pca = null, me = {name:"", email:""};
let items = {drop:[],inbox:[],receive:[],enter:[],queries:[],done:[]};
let log = [];
let current = "receive", search = "", selected = null, loading = false, error = "";
let blobCache = {}, pendingTarget = "receive";

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = s => { const d=new Date(s); return isNaN(d)?"":d.toLocaleString("en-AU",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); };
const kb = n => n>1048576 ? (n/1048576).toFixed(1)+" MB" : Math.max(1,Math.round((n||0)/1024))+" KB";
const enc = s => encodeURIComponent(s);
function toast(m){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
const typeOf = name => /^PO - /i.test(name) ? "po" : /^DE - /i.test(name) ? "de" : "";
const stripType = name => name.replace(/^(PO|DE) - /i,"");

/* ---------------- sign-in (Microsoft) ---------------- */
async function initAuth(){
  pca = new msal.PublicClientApplication({
    auth:{clientId:CONFIG.clientId, authority:"https://login.microsoftonline.com/"+CONFIG.tenantId,
          redirectUri: location.origin + location.pathname},
    cache:{cacheLocation:"localStorage"}
  });
  const res = await pca.handleRedirectPromise();
  if(res && res.account) pca.setActiveAccount(res.account);
  const acc = pca.getActiveAccount() || pca.getAllAccounts()[0];
  if(acc){ pca.setActiveAccount(acc); return true; }
  return false;
}
async function token(){
  const account = pca.getActiveAccount();
  try { return (await pca.acquireTokenSilent({scopes:SCOPES, account})).accessToken; }
  catch(e){ await pca.acquireTokenRedirect({scopes:SCOPES, account}); throw e; }
}
async function g(path, opts){
  opts = opts || {};
  const t = await token();
  const r = await fetch(path.startsWith("http") ? path : GRAPH + path,
    Object.assign({}, opts, {headers:Object.assign({Authorization:"Bearer "+t}, opts.headers||{})}));
  if(!r.ok){
    const err = new Error("Graph " + r.status); err.status = r.status;
    try{ const b = await r.json(); err.msg = b.error && b.error.message; }catch(_){}
    throw err;
  }
  if(opts.raw) return r;
  if(r.status === 204) return null;
  return (r.headers.get("content-type")||"").includes("json") ? r.json() : r;
}

/* ---------------- data ---------------- */
const SELECT = "id,name,size,file,createdDateTime,lastModifiedDateTime,createdBy,lastModifiedBy,webUrl";
async function listFolder(key){
  if(DEMO) return items[key];
  let url = "/drives/"+CONFIG.driveId+"/items/"+CONFIG.stages[key].id+"/children?$top=200&$select="+SELECT;
  const out = [];
  let pages = 0;
  while(url && pages < (key==="done" ? 3 : 20)){
    const page = await g(url);
    page.value.forEach(v => { if(v.file && !v.name.startsWith("_") && !v.name.startsWith("~$")) out.push(v); });
    url = page["@odata.nextLink"]; pages++;
  }
  return out.sort((a,b) => String(b.lastModifiedDateTime).localeCompare(String(a.lastModifiedDateTime)));
}
async function readLog(){
  if(DEMO) return {entries:log, etag:null};
  const meta = await g("/drives/"+CONFIG.driveId+"/items/"+CONFIG.logFileId+"?$select=id,eTag");
  const r = await g("/drives/"+CONFIG.driveId+"/items/"+CONFIG.logFileId+"/content", {raw:true});
  let entries = [];
  try{ entries = JSON.parse(await r.text()) || []; }catch(_){ entries = []; }
  return {entries, etag:meta.eTag};
}
async function addLog(entry){
  if(DEMO){ log.push(entry); return; }
  for(let i=0;i<4;i++){
    try{
      const L = await readLog();
      const next = L.entries.concat([entry]).slice(-5000);
      await g("/drives/"+CONFIG.driveId+"/items/"+CONFIG.logFileId+"/content",
        {method:"PUT", headers:{"Content-Type":"application/json","If-Match":L.etag}, body:JSON.stringify(next)});
      log = next; return;
    }catch(e){ if(e.status !== 412 && e.status !== 409) { console.warn("log write failed", e); return; } }
  }
}
async function refresh(quiet){
  if(loading) return;
  loading = true; if(!quiet) render();
  try{
    const keys = ORDER.filter(k => k !== "done" || current === "done" || !items.done.length);
    const lists = await Promise.all(keys.map(listFolder));
    keys.forEach((k,i) => items[k] = lists[i]);
    log = (await readLog()).entries;
    error = "";
  }catch(e){
    error = e.status === 403 || e.status === 404
      ? "You don’t have access to the Workflow folder yet. Ask Michelle to share it with you (Can edit)."
      : "Couldn’t load from SharePoint" + (e.msg ? ": " + e.msg : "") + ". Click Refresh to try again.";
  }
  loading = false; render();
}

/* ---------------- actions ---------------- */
async function move(item, from, to, newName, action, note){
  const target = newName || item.name;
  if(DEMO){
    items[from] = items[from].filter(i => i.id !== item.id);
    items[to].unshift(Object.assign({}, item, {name:target, lastModifiedDateTime:new Date().toISOString(), lastModifiedBy:{user:{displayName:me.name}}}));
  } else {
    let name = target, tries = 0;
    while(true){
      try{
        const body = {parentReference:{id:CONFIG.stages[to].id}};
        if(name !== item.name) body.name = name;
        await g("/drives/"+CONFIG.driveId+"/items/"+item.id, {method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
        break;
      }catch(e){
        if(e.status === 409 && tries < 5){ tries++; name = target.replace(/(\.[^.]+)?$/, m => " ("+(tries+1)+")"+m); continue; }
        throw e;
      }
    }
  }
  await addLog({id:item.id, name:target, at:new Date().toISOString(), by:me.name || me.email, from, to, action, note:note||""});
}

async function upload(files, target){
  target = target === "enter" ? "enter" : "receive";
  const prefix = target === "enter" ? "DE - " : "PO - ";
  const S = CONFIG.stages;
  const list = Array.from(files||[]).filter(f => f && f.size);
  if(!list.length) return;
  toast(list.length > 1 ? "Uploading " + list.length + " invoices…" : "Uploading " + list[0].name + "…");
  let ok = 0;
  for(const f of list){
    try{
      if(DEMO){
        items[target].unshift({id:"d"+Math.random().toString(36).slice(2), name:prefix+f.name, size:f.size, file:{mimeType:f.type},
          createdDateTime:new Date().toISOString(), lastModifiedDateTime:new Date().toISOString(),
          createdBy:{user:{displayName:me.name}}, lastModifiedBy:{user:{displayName:me.name}}, _blob:f});
      } else if(f.size <= 4*1024*1024){
        const fname = prefix + f.name;
        const created = await g("/drives/"+CONFIG.driveId+"/items/"+S[target].id+":/"+enc(fname)+":/content?@microsoft.graph.conflictBehavior=rename",
          {method:"PUT", headers:{"Content-Type":f.type||"application/octet-stream"}, body:f});
        await addLog({id:created.id, name:created.name, at:new Date().toISOString(), by:me.name||me.email, from:"", to:target, action:"dropped in", note:""});
      } else {
        const s = await g("/drives/"+CONFIG.driveId+"/items/"+S[target].id+":/"+enc(prefix+f.name)+":/createUploadSession",
          {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({item:{"@microsoft.graph.conflictBehavior":"rename"}})});
        const CH = 327680*10; let created = null;
        for(let start=0; start<f.size; start+=CH){
          const end = Math.min(start+CH, f.size);
          const r = await fetch(s.uploadUrl, {method:"PUT", headers:{"Content-Range":"bytes "+start+"-"+(end-1)+"/"+f.size}, body:f.slice(start,end)});
          if(!r.ok) throw Object.assign(new Error("upload"), {status:r.status});
          if(r.status === 200 || r.status === 201) created = await r.json();
        }
        if(created) await addLog({id:created.id, name:created.name, at:new Date().toISOString(), by:me.name||me.email, from:"", to:target, action:"dropped in", note:""});
      }
      ok++;
    }catch(e){ toast("Upload failed for " + f.name + (e.status ? " ("+e.status+")" : "")); }
  }
  if(ok){ toast(ok + (ok>1?" invoices":" invoice") + " added to " + S[target].label); current = target; }
  await refresh(true);
}

async function fileBlob(item){
  if(blobCache[item.id]) return blobCache[item.id];
  let blob;
  if(DEMO){
    blob = item._blob || new Blob(["%PDF demo"], {type:"application/pdf"});
  } else {
    const meta = await g("/drives/"+CONFIG.driveId+"/items/"+item.id+"?select=id,@microsoft.graph.downloadUrl");
    const r = await fetch(meta["@microsoft.graph.downloadUrl"]);
    if(!r.ok) throw new Error("download");
    blob = await r.blob();
  }
  const ext = (item.name.split(".").pop()||"").toLowerCase();
  const type = ext === "pdf" ? "application/pdf" : (item.file && item.file.mimeType) || blob.type;
  blob = new Blob([blob], {type});
  blobCache[item.id] = {blob, url:URL.createObjectURL(blob), type};
  return blobCache[item.id];
}

/* ---------------- views ---------------- */
function render(){
  if(!DEMO && !(pca && pca.getActiveAccount())){ renderSignIn(); return; }
  if(!shown().includes(current)) current = "receive";
  const S = CONFIG.stages, st = S[current];
  const q = search.trim().toLowerCase();
  const rows = items[current].filter(i => !q || i.name.toLowerCase().includes(q));
  app.innerHTML =
    '<div class="topbar"><div class="brand"><h1>'+esc(CONFIG.title)+'</h1><span>Accounts Payable</span></div>'+
      '<span class="who">'+esc(me.name || "")+(me.email && me.email !== me.name ? ' · '+esc(me.email) : '')+'</span>'+
      (DEMO ? '' : '<button class="btn" id="signout">Sign out</button>')+'</div>'+
    (DEMO ? '<div class="banner">Demo mode — sample invoices only. Add your Client ID and Tenant ID at the top of the file to connect to SharePoint.</div>' : '')+
    (error ? '<div class="banner">'+esc(error)+'</div>' : '')+
    '<div class="layout"><aside class="rail"><div class="eyebrow">Queues</div>'+
      shown().map(k => (k==="receive" ? '<div class="tabgroup"><span class="dot" style="background:var(--ink-2)"></span>Invoice workflow</div>' : '')+
        '<button class="tab'+(k==="receive"||k==="enter" ? ' sub' : '')+'" data-k="'+k+'" aria-current="'+(k===current)+'"><span class="dot" style="background:'+S[k].color+'"></span>'+
        '<span>'+esc(RAIL_LABEL[k] || S[k].label)+'<small>'+esc(S[k].who)+'</small></span><span class="count">'+(k==="drop" || (k==="done" && !items.done.length) ? "" : items[k].length)+'</span></button>').join("")+
      '<div class="rail-foot">Files live in SharePoint › AP JACK › IPS › AP › Workflow. Moving an invoice here moves it between those folders.</div>'+
    '</aside><main>'+
      '<div class="mainhead"><h2>'+esc(st.label)+'</h2>'+
        '<div class="right"><input type="search" id="search" placeholder="Search file name…" value="'+esc(search)+'">'+
        '<button class="btn" id="refresh">'+(loading?"Loading…":"Refresh")+'</button></div>'+
        '<p>'+esc(st.who)+(st.folder ? ' · SharePoint folder “'+esc(st.folder)+'”' : '')+'</p></div>'+
      (current === "drop" ? '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px">'+
        '<div class="drop" data-drop="receive" style="min-height:160px"><div><p><b>Receive invoice</b></p><span class="hint">Drop PO / stock invoices here — they go to the Receive invoice queue. Or click to browse.</span></div></div>'+
        '<div class="drop" data-drop="enter" style="min-height:160px"><div><p><b>Direct entry</b></p><span class="hint">Drop direct-entry invoices here — they go to the Enter invoice queue. Or click to browse.</span></div></div>'+
      '</div>' : '')+
      (current === "receive" ? '<div class="drop" data-drop="receive"><div><p><b>Drop invoices here → Receive invoice</b></p><span class="hint">PO / stock invoices that need receiving first. Or click to browse.</span></div></div>' : '')+
      (current === "enter" ? '<div class="drop" data-drop="enter"><div><p><b>Drop invoices here → Enter invoice</b></p><span class="hint">Direct entry, no receiving needed. Or click to browse.</span></div></div>' : '')+
      (current === "drop" ? '' : '<div class="tablewrap">'+(rows.length ? table(rows) : '<div class="empty"><h3>'+(loading?"Loading…":"Nothing here")+'</h3><p>'+
        (loading ? "" : "This queue is clear.")+'</p></div>')+'</div>')+
      (current === "done" && items.done.length >= 600 ? '<p class="sub">Showing the most recent 600 completed invoices. Older ones are in the SharePoint folder.</p>' : '')+
    '</main></div>';

  app.querySelectorAll(".tab").forEach(b => b.onclick = () => { current = b.dataset.k; search = ""; render(); if(current === "done" && !DEMO) refresh(true); });
  const s = document.getElementById("search");
  s.oninput = e => { search = e.target.value; const p = e.target.selectionStart; render(); const n = document.getElementById("search"); n.focus(); n.setSelectionRange(p,p); };
  document.getElementById("refresh").onclick = () => refresh();
  const so = document.getElementById("signout"); if(so) so.onclick = () => pca.logoutRedirect();
  app.querySelectorAll("[data-drop]").forEach(d => d.onclick = () => { pendingTarget = d.dataset.drop; fileInput.click(); });
  app.querySelectorAll("tbody tr").forEach(tr => tr.onclick = () => openItem(tr.dataset.id));
}

function lastNote(id){
  for(let i=log.length-1;i>=0;i--){ if(log[i].id === id && log[i].note) return log[i]; }
  return null;
}
function table(rows){
  return '<table><thead><tr><th>Invoice</th><th>Type</th><th>Added by</th><th>Last moved</th><th></th></tr></thead><tbody>'+
    rows.map(i => {
      const t = typeOf(i.name), n = current === "queries" ? lastNote(i.id) : null;
      return '<tr data-id="'+esc(i.id)+'"><td><div class="fname">'+esc(stripType(i.name))+'</div><div class="sub">'+kb(i.size)+
        (n ? ' · <span class="pill q">Query</span> '+esc(n.note.slice(0,80)) : '')+'</div></td>'+
        '<td>'+(t==="po"?'<span class="pill po">TO RECEIVE</span>':t==="de"?'<span class="pill de">DIRECT ENTRY</span>':'<span class="sub">—</span>')+'</td>'+
        '<td>'+esc((i.createdBy&&i.createdBy.user&&i.createdBy.user.displayName)||"—")+'<div class="sub">'+esc(when(i.createdDateTime))+'</div></td>'+
        '<td>'+esc((i.lastModifiedBy&&i.lastModifiedBy.user&&i.lastModifiedBy.user.displayName)||"—")+'<div class="sub">'+esc(when(i.lastModifiedDateTime))+'</div></td>'+
        '<td class="sub">Open ›</td></tr>';
    }).join("")+'</tbody></table>';
}

function actionsFor(item){
  const t = typeOf(item.name), base = stripType(item.name);
  switch(current){
    case "inbox": return [
      {label:"Send to Receive invoice", cls:"btn-primary", to:"receive", name:"PO - "+base, action:"sorted: to be received"},
      {label:"Send to Enter invoice", cls:"btn-go", to:"enter", name:"DE - "+base, action:"sorted: direct entry"}];
    case "receive": return [
      {label:"Received — send to Enter invoice", cls:"btn-go", to:"enter", action:"received"},
      {label:"Send back (query)", cls:"btn-warn", to:"queries", action:"query", needNote:true}];
    case "enter": return [
      {label:"Entered — complete", cls:"btn-go", to:"done", action:"entered"},
      {label:"Send back (query)", cls:"btn-warn", to:"queries", action:"query", needNote:true}];
    case "queries": return [
      {label:"Fixed — back to Receive invoice", cls:"btn-primary", to:"receive", name:"PO - "+base, action:"query fixed"},
      {label:"Fixed — back to Enter invoice", cls:"btn-go", to:"enter", name:(t||"de").toUpperCase()+" - "+base, action:"query fixed"}];
    case "done": return [
      {label:"Reopen — back to Enter invoice", cls:"btn-warn", to:"enter", action:"reopened", needNote:true}];
  }
  return [];
}

function openItem(id){
  const item = items[current].find(i => i.id === id); if(!item) return;
  selected = item;
  const hist = log.filter(l => l.id === id).slice().reverse();
  const acts = actionsFor(item);
  const S = CONFIG.stages;
  overlay.innerHTML = '<div class="scrim" id="scrim"></div><section class="drawer" role="dialog" aria-label="Invoice">'+
    '<header><div style="flex:1;min-width:0"><h3>'+esc(stripType(item.name))+'</h3><span class="sub">'+esc(S[current].label)+' · '+kb(item.size)+'</span></div>'+
    '<button class="btn" id="close">Close</button></header>'+
    '<div class="body"><div class="doc" id="doc"><div class="empty">Loading document…</div></div>'+
    '<div><div class="eyebrow" style="margin-left:0">History</div><ul class="trail">'+
      (hist.length ? hist.map(h => '<li><b>'+esc(h.by||"Someone")+'</b> '+esc(h.action)+(h.to && S[h.to] ? ' → '+esc(S[h.to].label) : '')+
        '<div class="when">'+esc(when(h.at))+'</div>'+(h.note ? '<div class="note">“'+esc(h.note)+'”</div>' : '')+'</li>').join("")
       : '<li><span class="sub">No history recorded yet (added before the website, or directly in SharePoint).</span></li>')+
    '</ul></div></div>'+
    '<div class="actions"><label class="sub" for="note">Note (required when sending back)</label><textarea id="note" placeholder="e.g. No PO number, supplier to resend…"></textarea>'+
    '<div class="actionrow">'+acts.map((a,i) => '<button class="btn '+a.cls+'" data-a="'+i+'">'+esc(a.label)+'</button>').join("")+
      '<button class="btn" id="dl" style="margin-left:auto">Download</button>'+
      (item.webUrl ? '<a class="btn" href="'+esc(item.webUrl)+'" target="_blank" rel="noopener" style="text-decoration:none">Open in SharePoint</a>' : '')+
    '</div></div></section>';

  const close = () => { overlay.innerHTML = ""; selected = null; };
  document.getElementById("close").onclick = close;
  document.getElementById("scrim").onclick = close;
  document.getElementById("dl").onclick = async () => {
    try{ const f = await fileBlob(item); const a = document.createElement("a"); a.href = f.url; a.download = item.name; document.body.appendChild(a); a.click(); a.remove(); }
    catch(e){ toast("Download failed"); }
  };
  overlay.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
    const a = acts[Number(b.dataset.a)];
    const note = document.getElementById("note").value.trim();
    if(a.needNote && !note){ toast("Add a note saying what’s needed"); document.getElementById("note").focus(); return; }
    overlay.querySelectorAll("button").forEach(x => x.disabled = true);
    try{
      const from = current;
      await move(item, from, a.to, a.name, a.action, note);
      toast("Moved to " + S[a.to].label);
      close(); await refresh(true);
    }catch(e){
      toast("Couldn’t move it" + (e.status ? " ("+e.status+")" : "") + " — someone may have moved it already. Refreshing.");
      close(); await refresh(true);
    }
  });
  fileBlob(item).then(f => {
    const box = document.getElementById("doc"); if(!box || selected !== item) return;
    if(DEMO && !item._blob){ box.innerHTML = '<div class="empty">PDF preview appears here once connected to SharePoint.</div>'; return; }
    box.innerHTML = f.type.startsWith("image/") ? '<img alt="Invoice" src="'+f.url+'">' : '<iframe title="Invoice" src="'+f.url+'#view=FitH"></iframe>';
  }).catch(() => { const box = document.getElementById("doc"); if(box) box.innerHTML = '<div class="empty">Couldn’t load a preview. Use Download or Open in SharePoint.</div>'; });
}

function renderSignIn(){
  app.innerHTML = '<div class="signin"><h2>'+esc(CONFIG.title)+'</h2><p>Sign in with your work account. If you’re a guest (e.g. Gmail), use the email address the invite was sent to — you’ll get a one-time code by email.</p>'+
    '<button class="btn btn-primary" id="signin">Sign in with Microsoft</button>'+(error ? '<p class="sub" style="margin-top:16px">'+esc(error)+'</p>' : '')+'</div>';
  document.getElementById("signin").onclick = () => pca.loginRedirect({scopes:SCOPES, prompt:"select_account"});
}

/* ---------------- drag & drop anywhere ---------------- */
["dragenter","dragover"].forEach(ev => window.addEventListener(ev, e => {
  if(!e.dataTransfer) return; e.preventDefault();
  document.querySelectorAll("[data-drop]").forEach(x => x.classList.toggle("hot", x.contains(e.target)));
}));
window.addEventListener("dragleave", e => { if(!e.relatedTarget) document.querySelectorAll("[data-drop]").forEach(x => x.classList.remove("hot")); });
window.addEventListener("drop", e => {
  e.preventDefault(); document.querySelectorAll("[data-drop]").forEach(x => x.classList.remove("hot"));
  if(!DEMO && !(pca && pca.getActiveAccount())) return;
  const zone = e.target.closest && e.target.closest("[data-drop]");
  if(!zone){ toast("Open Receive invoice or Enter invoice and drop onto its box"); return; }
  if(e.dataTransfer && e.dataTransfer.files.length) upload(e.dataTransfer.files, zone.dataset.drop);
});
fileInput.onchange = e => { upload(e.target.files, pendingTarget); e.target.value = ""; };

/* ---------------- start ---------------- */
function demoData(){
  me = {name:"Michelle (demo)", email:""};
  const mk = (name, daysAgo, by) => { const d = new Date(Date.now()-daysAgo*864e5).toISOString();
    return {id:"d"+Math.random().toString(36).slice(2), name, size:90000+Math.round(Math.random()*200000), file:{mimeType:"application/pdf"},
      createdDateTime:d, lastModifiedDateTime:d, createdBy:{user:{displayName:"Michelle"}}, lastModifiedBy:{user:{displayName:by||"Michelle"}}}; };
  items.inbox = [];
  items.receive = [mk("PO - Dulux Trade INV-88231.pdf",1), mk("PO - Grants Express 190452.pdf",0)];
  items.enter = [mk("DE - Origin Energy Oct26.pdf",1), mk("PO - Bunnings 4471020.pdf",2,"Receiver")];
  items.queries = [mk("PO - Mirka 55120.pdf",3,"Data entry")];
  items.done = [mk("DE - Officeworks 99812.pdf",6,"Data entry")];
  log = [{id:items.queries[0].id, name:items.queries[0].name, at:new Date(Date.now()-3*864e5).toISOString(), by:"Data entry", from:"enter", to:"queries", action:"query", note:"Price doesn't match the PO — please check with supplier"}];
}

async function start(){
  if(DEMO){ demoData(); render(); return; }
  try{
    const signedIn = await initAuth();
    if(!signedIn){ render(); return; }
    const acc = pca.getActiveAccount();
    me = {name: acc.name || acc.username, email: acc.username};
    await refresh();
    setInterval(() => { if(!overlay.innerHTML) refresh(true); }, 60000);
    window.addEventListener("focus", () => { if(!overlay.innerHTML) refresh(true); });
  }catch(e){
    error = "Sign-in problem: " + (e.errorMessage || e.message || e) ;
    render();
  }
}
start();
})();
</script>
